<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AutoGram</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('autogram_color_scheme') || 'dark';
          var resolved = mode;
          if (mode === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var palette = localStorage.getItem('autogram_color_palette') || 'default';
          var root = document.documentElement;
          root.setAttribute('data-color-scheme', resolved);
          root.setAttribute('data-color-scheme-mode', mode);
          root.setAttribute('data-palette', palette);
          root.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
