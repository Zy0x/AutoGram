[package]
name = "frontend"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "frontend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
keyring = "3"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny_http = "0.12"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
# Phase 4 — Grammers MTProto (dual-path with Telethon companion)
# NOTE: do NOT enable grammers-session default `sqlite-storage` (libsql) —
# it duplicates sqlite symbols with rusqlite `bundled` on Windows (LNK2005).
grammers-client = "0.10"
grammers-session = { version = "0.10", default-features = false, features = ["serde"] }
grammers-mtsender = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
log = "0.4"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[features]
default = ["grammers"]
# Compile-time enable of Grammers backend (runtime still dual-path via AUTOGRAM_TELEGRAM_BACKEND)
grammers = []


