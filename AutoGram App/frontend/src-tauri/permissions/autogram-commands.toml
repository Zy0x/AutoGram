    "set_credential",
    "delete_credential",
    "migrate_credentials_from_webstorage",
    "ensure_secure_dirs",
    "write_worker_temp_file",
    "delete_worker_temp_file",
    "seed_api_credentials_from_env",
    "open_path_safe",
    "open_with_dialog",
    "reveal_path_safe",
    "cache_file_ready",
