    "network_test_proxy",
    "network_is_available",
    "network_detect_vpn",
    "studio_enqueue",
    "studio_list_transfers",
    "studio_get_transfer",
    "studio_run_orchestrated",
    "tg_backend_status",
    "tg_set_backend",
    "tg_probe_session",
    "tg_import_telethon_session",
    "tg_auth_status",
