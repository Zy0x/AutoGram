[package]
name = "autogram-core"
version = "0.1.0"
edition = "2021"
description = "Pure Rust Core Logic, MTProto Streaming, SQLite DB & Media Engine for AutoGram"
authors = ["AutoGram Team"]

[lib]
name = "autogram_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
tokio-util = "0.7"
bytes = "1"
async-trait = "0.1"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
flate2 = "1.0"
rand = "0.8"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
urlencoding = "2.1"
grammers-client = "0.10"
grammers-session = { version = "0.10", default-features = false, features = ["serde"] }
grammers-mtsender = "0.10"
