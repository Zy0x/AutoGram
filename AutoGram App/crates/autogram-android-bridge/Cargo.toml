[package]
name = "autogram-android-bridge"
version = "0.1.0"
edition = "2021"
description = "Mozilla UniFFI Bridge for AutoGram Android Native (Kotlin/Jetpack Compose)"
authors = ["AutoGram Team"]

[lib]
name = "autogram_android_bridge"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
autogram-core = { path = "../autogram-core" }
uniffi = { version = "0.28", features = ["cli", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
thiserror = "2"
log = "0.4"
parking_lot = "0.12"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
